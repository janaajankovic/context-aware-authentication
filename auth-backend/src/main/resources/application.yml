server:
  port: 8080

spring:
  application:
    name: risk-auth-backend

  # Konfiguracija za PostgreSQL
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # Konfiguracija za JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Konfiguracija za Redis
  data:
    redis:
      host: localhost
      port: 6379